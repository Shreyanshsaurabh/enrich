name: Developer pipeline

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "Path of the input Excel file inside the repo"
        default: "data/all_apps.xlsx"
      limit:
        description: "Only process the top N developers (0 = all). Use 200 for a test run."
        default: "0"
      workers:
        description: "Parallel HTTP workers"
        default: "12"
      retry_failed:
        description: "Retry 429 / 5xx / timeout / crashed rows with backoff (rows that worked are skipped)"
        type: boolean
        default: true
      browser_fallback:
        description: "Retry empty / 403 rows in a headless browser and follow Contact links"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub's maximum for a single job

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas openpyxl requests beautifulsoup4 phonenumbers playwright

      - name: Install headless Chromium
        if: ${{ inputs.browser_fallback }}
        run: python -m playwright install --with-deps chromium

      # Restore scraping progress from the previous run, so only failed rows are redone
      - name: Restore privacy-page cache
        uses: actions/cache/restore@v4
        with:
          path: output/developers_enriched.xlsx.cache.json
          key: privacy-cache-${{ github.run_id }}
          restore-keys: |
            privacy-cache-

      - name: Run pipeline
        id: pipeline
        env:
          INPUT_FILE: ${{ inputs.input_file }}
          LIMIT: ${{ inputs.limit }}
          WORKERS: ${{ inputs.workers }}
          RETRY: ${{ inputs.retry_failed }}
          BROWSER: ${{ inputs.browser_fallback }}
        run: |
          mkdir -p output
          ARGS=""
          [ "$RETRY" = "true" ] && ARGS="$ARGS --retry-failed"
          [ "$BROWSER" = "true" ] && ARGS="$ARGS --browser-fallback"
          set +e
          # The script stops itself at 335 min and still writes the Excel;
          # 'timeout' is only a safety net.
          timeout 345m python developer_pipeline.py "$INPUT_FILE" output/developers_enriched.xlsx \
            --workers "$WORKERS" --limit "$LIMIT" --max-minutes 335 $ARGS
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # Save progress even if the run stopped early or failed
      - name: Save privacy-page cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/developers_enriched.xlsx.cache.json
          key: privacy-cache-${{ github.run_id }}

      - name: Upload Excel result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developers-enriched
          path: output/developers_enriched.xlsx
          if-no-files-found: ignore

      - name: Report outcome
        if: always()
        env:
          STATUS: ${{ steps.pipeline.outputs.status }}
        run: |
          if [ "$STATUS" = "0" ]; then
            echo "::notice::Finished. Download 'developers-enriched' from the run's Artifacts."
          elif [ "$STATUS" = "3" ] || [ "$STATUS" = "124" ]; then
            echo "::notice::Stopped at the time limit. Progress is saved - run the workflow again to continue."
          else
            echo "::error::Script failed with exit code $STATUS"
            exit 1
          fi
